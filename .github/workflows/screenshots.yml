# Takes the App Store screenshots in the iOS simulator, in all five store
# languages on iPhone and iPad, and commits them to AppStore/screenshots, with
# the purchase screen the in-app purchase review needs (AppStore/purchase-review.png).
# The website deploy picks up the English iPhone ones.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      devices:
        description: Only these devices, space separated (iphone, ipad; empty = both)
        type: string
        default: ""
      locales:
        description: Only these locales, space separated (empty = all five)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The simulators are booted by Scripts/screenshots.sh, after the build:
      # booting two while xcodebuild starts left it waiting on the simulator
      # service for 13 minutes before it compiled anything.
      # Signed ad hoc, as Xcode does for the simulator, without the iCloud
      # entitlement: the screenshots run on an in-memory store. Only arm64,
      # the runner's own architecture: a generic destination builds Intel too.
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project Burrow.xcodeproj \
            -scheme Burrow \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            -quiet

      - name: Take the screenshots
        env:
          LOCALES: ${{ inputs.locales }}
          DEVICES: ${{ inputs.devices }}
        run: Scripts/screenshots.sh

      - name: Remove the alpha channel
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          find AppStore/screenshots AppStore/purchase-review.png -name '*.png' -print0 2>/dev/null | xargs -0 "$RUNNER_TEMP/venv/bin/python" Scripts/flatten_png.py

      - name: Keep them as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            AppStore/screenshots/**/*.png
            AppStore/purchase-review.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots
          if [ -f AppStore/purchase-review.png ]; then git add AppStore/purchase-review.png; fi
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update App Store screenshots"
          # The build leaves generated changes behind; only the pictures are
          # committed. Someone may push meanwhile: rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
