# Takes the App Store screenshots in the iOS simulator, in all five store
# languages on iPhone and iPad, and commits them to AppStore/screenshots.
# The website deploy picks up the English iPhone ones.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Only these locales, space separated (empty = all five)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A fresh simulator takes minutes to boot the first time: start both now,
      # so they boot while the app compiles.
      - name: Start booting the simulators
        run: |
          pick() {
            xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          pattern = re.compile(sys.argv[1])
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devices if "iOS" in k), reverse=True):
              for d in sorted(devices[runtime], key=lambda d: d["name"], reverse=True):
                  if pattern.search(d["name"]):
                      print(d["udid"]); sys.exit()
          sys.exit("No simulator matching " + sys.argv[1])
          ' "$1"
          }
          iphone=$(pick 'iPhone .*Pro Max$')
          ipad=$(pick '^iPad Pro 13')
          echo "IPHONE_UDID=$iphone" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$ipad" >> "$GITHUB_ENV"
          xcrun simctl boot "$iphone"
          xcrun simctl boot "$ipad"

      # Signed ad hoc, as Xcode does for the simulator, without the iCloud
      # entitlement: the screenshots run on an in-memory store.
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project Burrow.xcodeproj \
            -scheme Burrow \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            -quiet

      - name: Take the screenshots
        env:
          LOCALES: ${{ inputs.locales }}
        run: Scripts/screenshots.sh

      - name: Remove the alpha channel
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          find AppStore/screenshots -name '*.png' -print0 | xargs -0 "$RUNNER_TEMP/venv/bin/python" Scripts/flatten_png.py

      - name: Keep them as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: AppStore/screenshots/**/*.png
          retention-days: 14

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update App Store screenshots"
          # The build leaves generated changes behind; only the pictures are
          # committed. Someone may push meanwhile: rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
