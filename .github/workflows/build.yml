name: Build

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Kidtopia.xcodeproj -scheme Kidtopia

      # A generic simulator destination compiles the app without needing a
      # simulator runtime to be installed on the runner image.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kidtopia.xcodeproj \
            -scheme Kidtopia \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""
